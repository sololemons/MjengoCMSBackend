spring.application.name=authentication-service
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url = jdbc:mysql://localhost:3306/mjengoauthenticationservice
spring.datasource.username = root
spring.datasource.password = Lemons_@75
spring.jpa.hibernate.ddl-auto = update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
server.port=8081
spring.jpa.show-sql=true
logging.level.root=INFO



#Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.ip-address=127.0.0.1
eureka.instance.prefer-ip-address=true

#RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


#Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.session.redis.namespace=spring:session

# Token Expiration in milliseconds
jwt.expiration.access=900000
jwt.expiration.refresh=604800000
jwt.expiration.registration=86400000


